<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="app.js" defer></script>

</head>
<body>
    <h1>Pagination</h1>
    <main>
        <h2>Navigate through Rick & Morty Characters</h2>
        <div id="output">
            <p>ID : info</p>
            <p>NAME: info</p>
            <p>Status: info</p>
            <p>Species: info</p>
            <img src="https://placehold.co/100" alt="Rick & Morty">
        </div>
        <button id="prev">Previous Page</button>
        <div id="container"></div>
        <button id="next">Next Page</button>
    </main>
</body>
</html>
